name: AutoFormat
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: write
jobs:
  runic:
    # Fork PRs give a read-only token; CI's `format` job still reports on them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      # Same action and Runic version as CI's `format` job; it exits nonzero when it rewrites files.
      - uses: fredrikekre/runic-action@v1
        continue-on-error: true
        with:
          version: "1"
          format_files: true
      - name: Commit and push
        id: push
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "Runic changed nothing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Format with Runic"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The bot's push opens the pull_request runs gated as `action_required`; approving them runs CI on the new head.
      # Skip this workflow's own run: it would join this concurrency group and cancel this job.
      - name: Approve CI on the new head and cancel the stale head's runs
        if: steps.push.outputs.sha
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.push.outputs.sha }}
          OLD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gated=".[] | select(.conclusion == \"action_required\" and .workflowName != \"$GITHUB_WORKFLOW\") | .databaseId"
          seen=0
          for attempt in $(seq 30); do
            sleep 10
            for run_id in $(gh run list --commit "$NEW_SHA" --event pull_request --json databaseId,conclusion,workflowName --jq "$gated"); do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
              echo "Approved run $run_id"
            done
            count=$(gh run list --commit "$NEW_SHA" --event pull_request --json databaseId --jq length)
            if [ "$count" -gt 0 ] && [ "$count" -eq "$seen" ]; then break; fi
            seen=$count
          done
          if [ "$seen" -eq 0 ]; then
            echo "::error::No pull_request runs appeared on $NEW_SHA; push an empty commit to start CI."
            exit 1
          fi
          gh run list --commit "$OLD_SHA" --json databaseId,status \
            --jq ".[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID) | .databaseId" \
            | xargs -r -n1 gh run cancel || true
